<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Precio realizado BTC</title>
<style>
  :root { --bg:#111827; --card:#1f2937; --text:#f9fafb; --muted:#9ca3af; --green:#16a34a; --gray:#4b5563; --orange:#f7931a; }
  * { box-sizing: border-box; }
  body { margin:0; width:340px; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, 'Segoe UI', sans-serif; }
  header { padding:14px 16px; background:var(--gray); transition:background .2s; }
  header.in { background:var(--green); }
  header h1 { margin:0; font-size:15px; }
  header p { margin:2px 0 0; font-size:12px; opacity:.9; }
  main { padding:12px 16px 14px; }
  .row { display:flex; justify-content:space-between; padding:5px 0; }
  .row span:first-child { color:var(--muted); }
  .row b { font-variant-numeric: tabular-nums; }
  .gauge { position:relative; height:12px; margin:14px 0 4px; background:var(--card); border-radius:6px; }
  .zone { position:absolute; top:0; bottom:0; background:var(--green); opacity:.55; border-radius:6px; }
  .real { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--orange); }
  .dot { position:absolute; top:-3px; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:#fff; border:3px solid var(--gray); }
  .dot.in { border-color:var(--green); }
  .legend { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
  .err { margin-top:8px; padding:6px 8px; background:#7f1d1d; border-radius:6px; font-size:12px; }
  .err:empty { display:none; }
  details { margin-top:12px; border-top:1px solid var(--card); padding-top:10px; }
  summary { cursor:pointer; color:var(--muted); font-size:12px; }
  label { display:block; margin:8px 0 2px; font-size:12px; color:var(--muted); }
  input[type=number] { width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--gray); background:var(--card); color:var(--text); }
  .check { display:flex; gap:6px; align-items:center; margin-top:8px; font-size:12px; color:var(--muted); }
  .btns { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; padding:7px; border:0; border-radius:6px; background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--orange); color:#111; font-weight:600; }
  .small { margin-top:8px; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header id="head">
  <h1 id="title">Cargando…</h1>
  <p id="subtitle"></p>
</header>
<main>
  <div class="row"><span>Precio BTC</span><b id="price">–</b></div>
  <div class="row"><span>Precio realizado</span><b id="realized">–</b></div>
  <div class="row"><span>Distancia</span><b id="diff">–</b></div>
  <div class="row"><span>Zona (<span id="pct">15</span>%)</span><b id="band">–</b></div>

  <div class="gauge" id="gauge">
    <div class="zone" id="zone"></div>
    <div class="real" id="realMark"></div>
    <div class="dot" id="dot"></div>
  </div>
  <div class="legend"><span>−50%</span><span>realizado</span><span>+100%</span></div>

  <div class="err" id="err"></div>

  <details>
    <summary>Ajustes</summary>
    <label for="range">Rango alrededor del precio realizado (±%)</label>
    <input type="number" id="range" min="1" max="100" step="1">
    <label for="manual">Precio realizado manual en USD (vacío = automático)</label>
    <input type="number" id="manual" min="0" step="1" placeholder="p. ej. 55000">
    <label class="check"><input type="checkbox" id="exit"> Avisar también al salir de la zona</label>
    <div class="btns">
      <button id="refresh">Actualizar ahora</button>
      <button id="save" class="primary">Guardar</button>
    </div>
  </details>
  <div class="small" id="foot"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
